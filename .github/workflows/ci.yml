name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: pip install -r requirements-dev.txt
      - name: clang-format
        run: |
          find coordinator \( -name build -prune \) -o \( -name '*.cpp' -o -name '*.hpp' \) -print \
            | xargs clang-format --dry-run --Werror

  coordinator:
    name: coordinator (${{ matrix.os }}, ${{ matrix.preset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, preset: debug-asan }
          - { os: ubuntu-24.04, preset: debug-tsan }
          - { os: macos-15, preset: debug-asan }
    env:
      VCPKG_ROOT: ${{ github.workspace }}/../vcpkg
    steps:
      - uses: actions/checkout@v5

      - name: Install Ninja and Clang (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # Ubuntu 24.04 uses 32 bits of mmap ASLR entropy, which TSan's shadow
      # memory layout doesn't support ("unexpected memory mapping").
      - name: Allow TSan memory layout
        if: matrix.preset == 'debug-tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28

      # Check out vcpkg at exactly the baseline pinned in vcpkg.json, so CI
      # resolves the same package versions as a local build.
      - name: Set up vcpkg
        run: |
          baseline=$(jq -r '."builtin-baseline"' coordinator/vcpkg.json)
          git clone --filter=tree:0 https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout "$baseline"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ matrix.os }}-${{ hashFiles('coordinator/vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.os }}-

      - name: Configure
        working-directory: coordinator
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        working-directory: coordinator
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        working-directory: coordinator
        run: ctest --preset ${{ matrix.preset }}

      # Against the ASan binary: a memory error in session code makes the
      # coordinator exit non-zero on SIGTERM, which fails the test.
      - name: Set up Python
        if: runner.os == 'Linux' && matrix.preset == 'debug-asan'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Integration tests
        if: runner.os == 'Linux' && matrix.preset == 'debug-asan'
        env:
          ORCH_COORDINATOR_BIN: coordinator/build/debug-asan/coordinator
        run: |
          pip install -r tests/integration/requirements.txt
          python -m pytest -q tests/integration

      # Validate our hand-written exposition format with Prometheus's own
      # parser and linter. Once per run is enough: the output doesn't depend
      # on OS or sanitizer.
      - name: Validate /metrics output with promtool
        if: runner.os == 'Linux' && matrix.preset == 'debug-asan'
        working-directory: coordinator
        run: |
          set -o pipefail
          ./build/${{ matrix.preset }}/tests/metrics_sample \
            | docker run --rm -i --entrypoint promtool prom/prometheus:v3.5.0 check metrics
